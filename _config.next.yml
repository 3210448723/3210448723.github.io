# ---------------------------------------------------------------
# NexT Theme Settings
# ---------------------------------------------------------------

# 主题风格：极简推荐 Mist
scheme: Mist

# 使用站点级覆盖文件，避免直接修改 themes/next，便于后续升级主题。
custom_file_path:
  head: source/_data/head.njk
  header: source/_data/header.njk
  postMeta: source/_data/post-meta.njk
  postBodyEnd: source/_data/post-body-end.njk
  style: source/_data/styles.styl

# 深色模式（默认跟随系统，也支持手动切换并记忆偏好）
darkmode: true

# 浏览器地址栏与移动端状态栏颜色。
theme_color:
  light: "#5b61d6"
  dark: "#171a2b"

# 菜单（简洁）
menu:
  home: / || fa fa-home
  archives: /archives/ || fa fa-archive
  categories: /categories/ || fa fa-th
  tags: /tags/ || fa fa-tags
  about: /about/ || fa fa-user

menu_settings:
  icons: true
  badges: true

# 头像
avatar:
  url: /img/head.jpg
  rounded: true
  rotated: false

# 侧边栏
sidebar:
  position: left
  display: post
  padding: 18
  offset: 12

# 文章元信息（克制但实用）
post_meta:
  item_text: true
  created_at: true
  updated_at: true
  categories: true

# 目录
toc:
  enable: true
  number: false
  wrap: false
  expand_all: false
  max_depth: 3

# 社交（按需改）
social:
  GitHub: https://github.com/3210448723 || fab fa-github
  CSDN: https://blog.csdn.net/qq_33843237/ || fa fa-book

social_icons:
  enable: true
  icons_only: false
  transition: true

# 本地搜索
local_search:
  enable: true
  top_n_per_article: 2
  unescape: true
  preload: false

# 正文阅读统计由 source/js/enhancements.js 轻量计算，不依赖额外 word-counter 插件。
symbols_count_time:
  separated_meta: true
  item_text_total: true

# 关闭花哨动画
motion:
  enable: false

# 代码块与阅读进度条
codeblock:
  language: true
  copy_button:
    enable: true
    style: mac
  fold:
    enable: false

reading_progress:
  enable: true
  start_at: left
  position: top
  reversed: false
  color: "#5b61d6"
  height: 4px

# 使用自定义卡片替代主题默认的简略上下篇链接。
post_navigation: false

back2top:
  enable: true
  sidebar: false
  scrollpercent: true

footer:
  since: 2023
  icon:
    name: fa fa-sparkles
    animated: false
    color: "#5b61d6"
  powered: true
  beian:
    enable: false
